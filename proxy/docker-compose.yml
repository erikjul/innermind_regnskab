# Fælles Caddy (HTTPS og fordeling af trafik) for alle apps på serveren.
# Hver app kører i sin egen docker compose og kobler sig på det fælles netværk "web".
# Opret netværket én gang:  docker network create web
# Start:  docker compose up -d
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

networks:
  web:
    external: true

volumes:
  caddy_data:
  caddy_config:
