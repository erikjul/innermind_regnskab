# Produktion: regnskabsprogram + daglig backup. HTTPS og adresse styres af den fælles Caddy i
# repoet server-proxy (netværket "web"), så flere apps kan dele serveren.
# Kopiér .env.example til .env og udfyld ANTHROPIC_API_KEY og REGNSKAB_SESSION_SECRET.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      REGNSKAB_HTTPS: "1"
    volumes:
      - regnskab_data:/data
      - regnskab_backup:/backup
    networks:
      default:
      web:
        aliases:
          - regnskab

  backup:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - regnskab_data:/data
      - regnskab_backup:/backup
    # Tager en sikkerhedskopi hver nat kl. 02 (containerens tid er UTC) og beholder de seneste 30
    command: >
      sh -c 'while true; do
               python -m app.backup;
               sleep $$(( (26*3600 - ($$(date +%s) % 86400)) % 86400 ));
             done'

networks:
  web:
    external: true

volumes:
  regnskab_data:
  regnskab_backup:
