# Brug denne fil, når serveren allerede har en reverse proxy (Caddy, nginx, Traefik), som ejer port 80/443.
# Programmet lytter kun lokalt på 127.0.0.1:8010; proxyen sender trafik for regnskabsdomænet videre dertil.
#
#   docker compose -f deploy/docker-compose.bag-proxy.yml up -d --build
#
# Tilføj derefter regnskabsdomænet i den eksisterende proxy, se deploy/Caddyfile.snippet eller deploy/nginx.snippet.conf.
name: innermind_regnskab
services:
  app:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      REGNSKAB_HTTPS: "1"
    volumes:
      - regnskab_data:/data
      - regnskab_backup:/backup
    ports:
      - "127.0.0.1:8010:8000"

  backup:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - regnskab_data:/data
      - regnskab_backup:/backup
    command: >
      sh -c 'while true; do
               python -m app.backup;
               sleep $$(( (26*3600 - ($$(date +%s) % 86400)) % 86400 ));
             done'

volumes:
  regnskab_data:
  regnskab_backup:
