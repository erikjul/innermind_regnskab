# Brug denne fil, når serveren allerede har en Caddy/nginx/Traefik i Docker, som ejer port 80/443 og
# sender trafik videre over et fælles Docker-netværk (som fx opsætningen i /opt/server-proxy).
#
#   PROXY_NETWORK=server-proxy_default docker compose -f deploy/docker-compose.bag-proxy.yml up -d --build
#
# Programmet får det faste containernavn "innermind-regnskab" og lytter på port 8000 på det fælles netværk.
# Tilføj derefter regnskabsdomænet i proxyens Caddyfile, se deploy/Caddyfile.snippet.
name: innermind_regnskab
services:
  app:
    build: ..
    container_name: innermind-regnskab
    restart: unless-stopped
    env_file: ../.env
    environment:
      REGNSKAB_HTTPS: "1"
    volumes:
      - regnskab_data:/data
      - regnskab_backup:/backup
    networks:
      - default
      - proxy

  backup:
    build: ..
    container_name: innermind-regnskab-backup
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - regnskab_data:/data
      - regnskab_backup:/backup
    command: >
      sh -c 'while true; do
               python -m app.backup;
               sleep $$(( (26*3600 - ($$(date +%s) % 86400)) % 86400 ));
             done'

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-server-proxy_default}

volumes:
  regnskab_data:
  regnskab_backup:
