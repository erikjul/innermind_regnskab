# Til en server, hvor nginx ejer port 80/443. Læg filen i /etc/nginx/sites-available/regnskab, lav et symlink
# til sites-enabled, kør  certbot --nginx -d regnskab.innermind.dk  for HTTPS, og  nginx -s reload.
server {
    server_name regnskab.innermind.dk;
    client_max_body_size 40M;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    listen 80;
}
